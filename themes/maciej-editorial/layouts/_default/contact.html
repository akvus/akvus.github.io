{{ define "main" }}
  <section class="contact-page shell">
    <div class="contact-title"><p class="eyebrow">Start a conversation</p><h1>{{ .Title }}</h1></div>
    <div class="contact-copy">
      <div class="prose">{{ .Content }}</div>
      <a class="contact-email" href="mailto:{{ site.Params.email }}"><span>Email</span><strong>{{ site.Params.email }}</strong><i aria-hidden="true">↗</i></a>
      <dl class="contact-facts">
        <div><dt>Based in</dt><dd>{{ site.Params.location }}</dd></div>
        <div><dt>Find me</dt><dd><a href="{{ site.Params.social.github }}">GitHub</a>, <a href="{{ site.Params.social.linkedin }}">LinkedIn</a>, <a href="{{ site.Params.social.x }}">X</a></dd></div>
      </dl>
    </div>
  </section>
{{ end }}
