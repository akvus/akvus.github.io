<footer class="site-footer">
  <div class="shell footer-grid">
    <div>
      <a class="footer-brand" href="{{ site.Home.RelPermalink }}">Maciej Zawieja</a>
      <p>Software engineering, mobile products, and notes from the work.</p>
    </div>
    <div>
      <p class="footer-label">Explore</p>
      <nav class="footer-links" aria-label="Footer navigation">
        {{ range site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
        <a href="{{ "index.xml" | relURL }}">RSS</a>
      </nav>
    </div>
    <div>
      <p class="footer-label">Elsewhere</p>
      <nav class="footer-links" aria-label="Social links">
        <a href="{{ site.Params.social.github }}" rel="me noopener" target="_blank">GitHub <span aria-hidden="true">↗</span></a>
        <a href="{{ site.Params.social.linkedin }}" rel="me noopener" target="_blank">LinkedIn <span aria-hidden="true">↗</span></a>
        <a href="{{ site.Params.social.x }}" rel="me noopener" target="_blank">X <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </div>
  <div class="shell footer-bottom">
    <span>© {{ now.Year }} Maciej Zawieja</span>
    <a href="{{ "pp_gp.html" | relURL }}">QuickMemot privacy</a>
  </div>
</footer>
