{{ $current := . }}
<header class="site-header" data-header>
  <div class="shell header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} — home">
      <span class="brand-mark" aria-hidden="true">MZ</span>
      <span class="brand-name">Maciej Zawieja</span>
    </a>

    <button class="nav-toggle icon-button" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span class="sr-only">Open navigation</span>
      <span class="nav-toggle-lines" aria-hidden="true"></span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Primary navigation" data-nav>
      {{ range site.Menus.main }}
        {{ $active := or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }}
        <a href="{{ .URL }}"{{ if $active }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <button class="theme-toggle icon-button" type="button" aria-label="Switch color theme" title="Switch color theme" data-theme-toggle>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </nav>
  </div>
</header>
