<article class="article-card">
  <a class="card-media" href="{{ .RelPermalink }}" tabindex="-1" aria-hidden="true">
    {{ partial "cover.html" (dict "page" . "class" "card-cover") }}
  </a>
  <div class="card-body">
    <div class="card-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
      <span aria-hidden="true">·</span>
      <span>{{ .ReadingTime }} min read</span>
    </div>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <p>{{ .Description }}</p>
    <div class="card-footer">
      {{ with index .Params.categories 0 }}<a class="pill" href="{{ printf "/categories/%s/" (. | urlize) | relURL }}">{{ . }}</a>{{ end }}
      <a class="text-link" href="{{ .RelPermalink }}" aria-label="Read {{ .Title }}">Read article <span aria-hidden="true">→</span></a>
    </div>
  </div>
</article>
